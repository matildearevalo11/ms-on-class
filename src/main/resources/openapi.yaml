openapi: 3.1.0
info:
  title: On-Class Bootcamp API
  version: 1.0.0
  description: Microservicio de bootcamps.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /bootcamps/most-enrolled:
    get:
      operationId: getMostEnrolledBootcamp
      summary: Mostrar el bootcamp con más personas inscritas
      description: Incluye personas, capacidades y tecnologías. Requiere rol ADMIN.
      responses:
        '200':
          description: Bootcamp con más personas inscritas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MostEnrolledBootcamp'
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '404':
          description: No hay bootcamps registrados.
        '503':
          description: Servicio dependiente o base de datos no disponible.
  /bootcamps/{id}/enrollments:
    post:
      operationId: enrollInBootcamp
      summary: Inscribirse en un bootcamp
      description: Inscribe a la persona del token en un bootcamp sin cruce de fechas y con máximo cinco inscripciones vigentes. Requiere rol PERSON.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del bootcamp.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '201':
          description: Inscripción creada.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol PERSON.
        '404':
          description: Bootcamp inexistente.
        '409':
          description: Inscripción repetida, cruce de fechas o límite alcanzado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Base de datos no disponible.
  /bootcamps/{id}:
    delete:
      operationId: deleteBootcamp
      summary: Eliminar bootcamp
      description: Elimina el bootcamp junto con sus capacidades y tecnologías. Se rechaza con 409 si comparte capacidades o tecnologías con otro bootcamp. Requiere rol ADMIN.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del bootcamp.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Bootcamp eliminado.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '404':
          description: Bootcamp inexistente.
        '409':
          description: El bootcamp comparte capacidades o tecnologías con otro bootcamp, o cambió mientras se eliminaba.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Servicio dependiente o base de datos no disponible.
  /bootcamps:
    get:
      operationId: listBootcamps
      summary: Listar bootcamps
      description: Lista bootcamps con capacidades y tecnologías. Requiere rol ADMIN.
      parameters:
        - name: page
          in: query
          description: Página desde cero.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Elementos por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: sortBy
          in: query
          description: Campo de orden.
          schema:
            type: string
            enum: [name, capacityCount]
            default: name
        - name: direction
          in: query
          description: Dirección de orden.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Página de bootcamps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootcampPage'
        '400':
          description: Parámetros inválidos.
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '503':
          description: Servicio de capacidades o base de datos no disponible.
    post:
      operationId: createBootcamp
      summary: Registrar bootcamp
      description: Registra un bootcamp con 1 a 4 capacidades existentes. Requiere rol ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootcampRequest'
      responses:
        '201':
          description: Bootcamp registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootcampResponse'
        '400':
          description: Datos inválidos o capacidades inexistentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Autenticación requerida.
        '403':
          description: Requiere rol ADMIN.
        '409':
          description: Otra operación modificó las mismas capacidades. Reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Servicio de capacidades o base de datos no disponible.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TechnologySummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CapacityDetail:
      type: object
      required: [id, name, technologies]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologySummary'
    BootcampListItem:
      type: object
      required: [id, name, description, launchDate, durationDays, capacities]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        launchDate:
          type: string
          format: date
        durationDays:
          type: integer
        capacities:
          type: array
          items:
            $ref: '#/components/schemas/CapacityDetail'
    BootcampPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BootcampListItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PersonSummary:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    MostEnrolledBootcamp:
      allOf:
        - $ref: '#/components/schemas/BootcampListItem'
        - type: object
          required: [personCount, persons]
          properties:
            personCount:
              type: integer
              minimum: 0
            persons:
              type: array
              items:
                $ref: '#/components/schemas/PersonSummary'
    BootcampRequest:
      type: object
      required: [name, description, launchDate, durationDays, capacityIds]
      properties:
        name:
          type: string
          minLength: 1
          description: Nombre del bootcamp.
          example: Desarrollo Backend
        description:
          type: string
          minLength: 1
          description: Descripción del bootcamp.
          example: Formación en servicios backend.
        launchDate:
          type: string
          format: date
          description: Fecha de lanzamiento.
          example: '2026-11-01'
        durationDays:
          type: integer
          minimum: 1
          description: Duración en días.
          example: 90
        capacityIds:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: IDs de capacidades existentes.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [1, 2]
    BootcampResponse:
      allOf:
        - $ref: '#/components/schemas/BootcampRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
    ErrorResponse:
      type: object
      properties:
        errors:
          type: object
          properties:
            message:
              type: string
